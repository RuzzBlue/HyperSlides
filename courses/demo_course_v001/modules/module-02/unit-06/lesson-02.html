<div class="space-y-10 text-left">
  <div>
    <span class="text-xs font-semibold uppercase tracking-wider text-teal-700 dark:text-teal-400">Hover · Rich tips</span>
    <h2 class="mt-1 text-3xl font-black tracking-tight text-slate-900 dark:text-white">Rich tooltips</h2>
    <p class="mt-2 max-w-2xl text-sm text-slate-600 dark:text-slate-400">
      Tips that hold title, subtitle, lists, icons — and a custom footer meta layout.
    </p>
  </div>

  <section>
    <span class="mb-3 block text-[10px] font-black uppercase tracking-[0.18em] text-teal-700">Rich content</span>
    <div class="hc-tip-row">
      <button type="button" class="hc-tip hc-tip--top hc-tip--rich">
        Hover for details
        <span class="hc-tip__bubble hc-tip__bubble--rich" role="tooltip">
          <span class="hc-tip__emoji" aria-hidden="true">✨</span>
          <strong class="hc-tip__title">Lesson checklist</strong>
          <span class="hc-tip__sub">What to verify before publishing</span>
          <span class="hc-tip__bold">Must include:</span>
          <ul>
            <li>Clear learning objective</li>
            <li>At least one visual</li>
            <li>Notes for facilitators</li>
          </ul>
          <ol>
            <li>Draft</li>
            <li>Review</li>
            <li>Ship</li>
          </ol>
        </span>
      </button>
    </div>
  </section>

  <section>
    <span class="mb-3 block text-[10px] font-black uppercase tracking-[0.18em] text-teal-700">Custom layout · meta footer</span>
    <div class="hc-tip-row">
      <button type="button" class="hc-tip hc-tip--bottom hc-tip--rich">
        Course overview tip
        <span class="hc-tip__bubble hc-tip__bubble--course" role="tooltip">
          <strong class="hc-tip__title">HyperClass Demo</strong>
          <span class="hc-tip__sub">Slides · components · assessment</span>
          <p class="hc-tip__desc">
            A clean showcase package that walks through every layout and interactive portal available in the presenter.
          </p>
          <div class="hc-tip__meta">
            <span>10 Lessons</span>
            <span class="hc-tip__dot" aria-hidden="true"></span>
            <span>4 quizzes</span>
            <span class="hc-tip__dot" aria-hidden="true"></span>
            <span>3 labs</span>
          </div>
        </span>
      </button>
    </div>
  </section>
</div>
