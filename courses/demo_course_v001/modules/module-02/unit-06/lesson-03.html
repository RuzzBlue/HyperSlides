<div class="space-y-6 text-left">
  <div>
    <span class="text-xs font-semibold uppercase tracking-wider text-teal-700 dark:text-teal-400">Hover · Cursors</span>
    <h2 class="mt-1 text-3xl font-black tracking-tight text-slate-900 dark:text-white">Cursor styles</h2>
    <p class="mt-2 max-w-2xl text-sm text-slate-600 dark:text-slate-400">
      Move over each tile — the pointer changes. Custom emoji cursors fall back to pointer if unsupported.
    </p>
  </div>

  <section>
    <div class="hc-cursor-grid">
      <div class="hc-cursor-tile hc-cursor--default">default</div>
      <div class="hc-cursor-tile hc-cursor--pointer">pointer · hand</div>
      <div class="hc-cursor-tile hc-cursor--arrow">default arrow</div>
      <div class="hc-cursor-tile hc-cursor--forbidden">not-allowed</div>
      <div class="hc-cursor-tile hc-cursor--wait">wait</div>
      <div class="hc-cursor-tile hc-cursor--crosshair">crosshair</div>
      <div class="hc-cursor-tile hc-cursor--grab">grab</div>
      <div class="hc-cursor-tile hc-cursor--zoom">zoom-in</div>
      <div class="hc-cursor-tile hc-cursor--emoji">emoji ★</div>
      <div class="hc-cursor-tile hc-cursor--icon">icon spark</div>
    </div>
  </section>
</div>
