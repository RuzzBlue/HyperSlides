<div class="space-y-8 text-left">
  <div>
    <span class="text-xs font-semibold uppercase tracking-wider text-teal-700 dark:text-teal-400">Media embeds</span>
    <h2 class="mt-1 text-3xl font-black tracking-tight text-slate-900 dark:text-white">Video, PDF &amp; course assets</h2>
    <p class="mt-2 max-w-2xl text-sm text-slate-600 dark:text-slate-400">
      YouTube uses a nonsense id so the player may fail — intentional for a disconnected demo. PDF and files are real course assets.
    </p>
  </div>

  <div>
    <span class="mb-2 block text-[10px] font-black uppercase tracking-[0.18em] text-teal-700">YouTube (placeholder id)</span>
    <div data-component="yt-video" data-video-id="demo_placeholder_will_not_load"></div>
  </div>

  <div>
    <span class="mb-2 block text-[10px] font-black uppercase tracking-[0.18em] text-teal-700">PDF embed</span>
    <div data-component="pdf-embed" data-src="assets/documents/sample-document.pdf" data-title="Sample document (lorem demo)"></div>
  </div>

  <div>
    <span class="mb-2 block text-[10px] font-black uppercase tracking-[0.18em] text-teal-700">Asset image</span>
    <div
      data-component="asset-image"
      data-src="assets/images/sample-diagram.svg"
      data-title="Sample diagram"
      data-caption="Lorem ipsum — course-local SVG asset."
    ></div>
  </div>

  <div>
    <span class="mb-2 block text-[10px] font-black uppercase tracking-[0.18em] text-teal-700">Asset download</span>
    <div data-component="asset-download" data-src="assets/others/sample-notes.txt" data-label="Download sample notes (.txt)"></div>
  </div>
</div>
