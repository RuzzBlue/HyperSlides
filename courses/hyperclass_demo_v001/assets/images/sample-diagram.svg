                function bindingOver(idPrincipal,idSecundario){
			document.getElementById('rectX'+idPrincipal).style.opacity='1';
			document.getElementById('rectY'+idSecundario).style.opacity='0';	
			if( document.getElementById('rectY'+(idSecundario+1))!=null ){
			  document.getElementById('rectY'+(idSecundario+1)).style.opacity='0';	
			}
			
                }
                function bindingOut(idPrincipal,idSecundario){
			document.getElementById('rectX'+idPrincipal).style.opacity='0';
			document.getElementById('rectY'+idSecundario).style.opacity='1';	
			if( document.getElementById('rectY'+(idSecundario+1))!=null ){
				document.getElementById('rectY'+(idSecundario+1)).style.opacity='1';	
			}
			
              }
               
